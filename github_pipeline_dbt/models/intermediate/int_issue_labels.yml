models:
  - name: int_issue_labels
    columns:
      - name: issue_id
        data_tests:
          - not_null
          - relationship:
              arguments:
                to: ref('fact_issues')
                field: issue_id

      - name: label_id
        data_tests:
          - not_null

    # issue_id and label_id are both not unique so a combination of both is used as the composite PK
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - issue_id
              - label_id
